name: CI-CD Purchase Service

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------------------------
    # 1. Checkout source code
    # -------------------------------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # -------------------------------------------------
    # 2. Setup .NET SDK
    # -------------------------------------------------
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # -------------------------------------------------
    # 3. Restore dependencies
    # -------------------------------------------------
    #- name: Restore dependencies
    #  run: dotnet restore

    # -------------------------------------------------
    # 4. Run unit tests
    # -------------------------------------------------
    #- name: Run unit tests
    #  run: dotnet test tests/UnitTests/UnitTests.csproj --configuration Release

    # -------------------------------------------------
    # 5. Configure AWS credentials
    # -------------------------------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # -------------------------------------------------
    # 6. Login to Amazon ECR
    # -------------------------------------------------
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # -------------------------------------------------
    # 7. Generate image tag
    # -------------------------------------------------
    - name: Set image tag
      id: tag
      run: echo "TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

    # -------------------------------------------------
    # 8. Build Docker image
    # -------------------------------------------------
    - name: Build Docker image
      run: |
        docker build \
          -t purchase-service:${{ steps.tag.outputs.TAG }} .

    # -------------------------------------------------
    # 9. Push image to Amazon ECR
    # -------------------------------------------------
    - name: Push image to ECR
      run: |
        docker tag purchase-service:${{ steps.tag.outputs.TAG }} \
          ${{ secrets.ECR_REGISTRY }}/purchase-service:${{ steps.tag.outputs.TAG }}

        docker push \
          ${{ secrets.ECR_REGISTRY }}/purchase-service:${{ steps.tag.outputs.TAG }}

    # -------------------------------------------------
    # 10. Deploy only purchase-service on EC2
    # -------------------------------------------------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/microservices

          # Update only purchase-service tag
          sed -i 's/^PURCHASE_TAG=.*/PURCHASE_TAG=${{ steps.tag.outputs.TAG }}/' .env

          # Pull and restart only this service
          docker compose pull purchase-service
          docker compose up -d purchase-service
